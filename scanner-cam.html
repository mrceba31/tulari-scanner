<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TULARI Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>

html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#000;
    overflow:hidden;
}

#reader{
    width:100vw !important;
    height:100vh !important;
}

#reader video{
    width:100% !important;
    height:100% !important;
    object-fit:cover !important;
}

#status{
    position:fixed;
    top:0;
    left:0;
    right:0;
    padding:16px;
    text-align:center;
    color:white;
    font-family:Arial;
    font-size:16px;
    z-index:50;
    background:rgba(0,0,0,.5);
}

</style>
</head>
<body>

<div id="status">📷 Arahkan kamera ke QR Code peserta</div>

<div id="reader"></div>

<script>

let hasScanned = false;

const scanner = new Html5Qrcode("reader");

scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    function(decodedText){

        if(hasScanned) return;

        hasScanned = true;

        document.getElementById("status").innerHTML = "✅ Berhasil scan: " + decodedText + " — menutup...";

        scanner.stop();

        if(window.opener){
            window.opener.postMessage({ type:"TULARI_QR_SCAN", data:decodedText }, "*");
        }

        setTimeout(function(){
            window.close();
        }, 1200);

    },
    function(error){}
);

</script>

</body>
</html>
